<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ORALIX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="login-box">
        <h1>ORALIX</h1>
        <h2>Acesso ao sistema</h2>
        <p id="mensagem" class="mensagem"></p>

        <form id="formulario-login">
            <label for="cpf">CPF (somente números)</label>
            <input type="text" id="cpf" placeholder="Ex.: 11111111111" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>

            <button type="submit">Entrar</button>
        </form>

        <div class="usuarios-teste">
            <strong>Usuários para teste</strong>
            <p>Cidadão: 11111111111 | 123456</p>
            <p>UBS: 22222222222 | 123456</p>
            <p>Admin: 00000000000 | 123456</p>
        </div>

        <a href="index.html">Voltar ao início</a>
    </main>
